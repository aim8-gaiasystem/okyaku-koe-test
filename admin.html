<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f8a4c">
<title>お客様の声メモ（管理者）</title>
<link rel="stylesheet" href="/common.css">
<style>
  :root { --accent: var(--green); --soft: var(--green-soft); }
  main { max-width:720px; }
  .bar-top .in { max-width:720px; }
  h2 { font-size:18px; margin:20px 0 8px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tabs button { flex:1; margin:0; padding:12px; font-size:16px; background:#fff; color:var(--ink); border:2px solid var(--line); border-radius:12px; box-shadow:none; }
  .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
    label.ttl:first-child { margin-top:0; }
  .item { border-top:1px solid var(--line); padding:14px 0; display:flex; gap:12px; }
  .item:first-child { border-top:none; padding-top:0; }
  .item .body { flex:1; min-width:0; }
  .item img { flex:none; width:84px; height:84px; object-fit:cover; border-radius:10px; cursor:zoom-in; }
  .stars-s { color:var(--yellow); font-size:14px; letter-spacing:1px; }
  .filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .filters .chips { gap:6px; }
  .filters .chips button { padding:6px 12px; font-size:14px; }
  .toplink { display:flex; gap:8px; margin-bottom:12px; }
  .toplink a { flex:1; display:block; text-align:center; padding:12px; border-radius:12px; background:#fff; border:2px solid var(--line); color:var(--green-dark); font-weight:700; text-decoration:none; font-size:15px; }
  .lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); align-items:center; justify-content:center; padding:16px; z-index:10; }
  .lightbox img { max-width:100%; max-height:100%; border-radius:8px; }
  .summary { font-weight:bold; }
  .meta { font-size:13px; color:var(--sub); margin-top:4px; }
  .raw { font-size:14px; color:var(--sub); margin-top:4px; white-space:pre-wrap; }
  .stat { display:grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap:8px; }
  .stat div { background:var(--bg); border-radius:8px; padding:10px; }
  .stat b { display:block; font-size:22px; }
  .bar { display:flex; align-items:center; gap:8px; font-size:15px; margin:4px 0; }
  .bar span:first-child { width:110px; flex:none; font-size:14px; }
  .bar i { display:block; height:12px; background:var(--accent); border-radius:6px; }
  .bar b, .bar em { white-space:nowrap; }
  .bar em { font-style:normal; color:var(--sub); font-size:13px; }
  .theme { border-left:4px solid var(--accent); padding:4px 0 4px 12px; margin:12px 0; }
  .theme .q { font-size:14px; color:var(--sub); margin:2px 0; }
  ul { margin:4px 0; padding-left:20px; }
  .act { border:1px solid var(--line); border-radius:10px; padding:12px; margin:10px 0; }
  .act .head { display:flex; gap:10px; align-items:baseline; }
  .act .rank { flex:none; width:28px; height:28px; border-radius:50%; background:var(--orange); color:#fff; font-weight:bold; display:flex; align-items:center; justify-content:center; font-size:15px; }
  .act .name { font-weight:bold; font-size:17px; }
  .act .scores { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .act .scores span { font-size:13px; background:var(--bg); border-radius:6px; padding:2px 8px; }
  .act .row { font-size:15px; margin:2px 0; }
  .act .row b { color:var(--sub); font-weight:normal; }
  .status { display:flex; gap:6px; margin-top:10px; }
  .status button { flex:1; margin:0; padding:8px 4px; font-size:14px; font-weight:normal; background:#fff; color:var(--ink); border:2px solid var(--line); border-radius:10px; }
  .status button.on { background:var(--soft); color:var(--green-dark); border-color:var(--green); font-weight:bold; }
  .rv { border-left:4px solid #8c959f; padding:4px 0 4px 12px; margin:8px 0; font-size:15px; }
  #passbox, #page-report { display:none; }
</style>
</head>
<body>
<header class="bar-top">
  <div class="in">
    <div class="logo">声</div>
    <div><h1>お客様の声メモ</h1><div class="small">管理者</div></div>
  </div>
</header>
<main>

  <div class="card" id="passbox">
    <label class="ttl" for="pass">管理者の合言葉</label>
    <input id="pass" type="password" autocomplete="off">
    <button class="btn green" id="passbtn" type="button">開く</button>
  </div>

  <div class="tabs">
    <button type="button" id="tab-record" class="on">集まった声</button>
    <button type="button" id="tab-report">月次レポート</button>
  </div>

  <section id="page-record">
    <div class="toplink">
      <a href="/" target="_blank">店員さんの入力画面</a>
      <a href="/koe.html" target="_blank">お客様用の画面</a>
    </div>
    <div class="card">
      <div class="filters">
        <div class="chips" id="f-source"></div>
        <div class="chips" id="f-kind"></div>
      </div>
      <div id="list">読み込み中…</div>
    </div>
  </section>

  <section id="page-report">
    <div class="card">
      <label class="ttl" for="month">対象の月</label>
      <input id="month" type="month">
      <label class="ttl" for="context">お店の事情（任意）</label>
      <textarea id="context" style="min-height:80px" placeholder="例：夕方は人手が足りない。今月は設備にお金をかけられない。駐車場の工事は来年予定"></textarea>
      <button class="btn" id="make" type="button">この月のレポートを作る</button>
      <div class="msg" id="rmsg"></div>
    </div>
    <div class="card" id="report">月を選ぶと、作成済みのレポートが表示されます</div>
  </section>
</main>
<div class="lightbox" id="lightbox"><img id="lightbox-img" alt="写真"></div>
<script src="/common.js"></script>
<script>
  const SECTIONS = ['惣菜','青果','鮮魚','精肉','日配','加工食品','日用品','レジ','駐車場','その他'];
  const OUTCOMES = ['対応できた','お断りした','その他'];
  const $ = (id) => document.getElementById(id);
  let passcode = '';
  try { passcode = localStorage.getItem('adminPasscode') || ''; } catch (e) {}
  let rows = [], fSource = '', fKind = '';

  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function chips(el, list, onPick) {
    el.innerHTML = list.map(v => `<button type="button" data-v="${esc(v)}">${esc(v)}</button>`).join('');
    el.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const on = !b.classList.contains('on');
      el.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      if (on) b.classList.add('on');
      onPick(on ? b.dataset.v : '');
    });
  }
  chips($('f-source'), ['店員から', 'お客様から'], v => { fSource = v; draw(); });
  chips($('f-kind'), ['お客様の声', 'ありません', '困りごと', 'アイデア', '欲しい商品', 'ご意見・ご要望'], v => { fKind = v; draw(); });

  async function api(path, method, body) {
    const res = await fetch(path, {
      method,
      headers: { 'Content-Type': 'application/json', 'x-passcode': passcode },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) { $('passbox').style.display = 'block'; throw new Error('管理者の合言葉を入力してください'); }
    if (!res.ok) throw new Error(data.error || 'エラーが発生しました');
    return data;
  }

  const KIND_COLOR = { 'お客様の声': '', 'ありません': 'red', '困りごと': 'orange', 'アイデア': 'yellow', '欲しい商品': 'red', 'ご意見・ご要望': 'blue' };
  function draw() {
    const shown = rows.filter(r =>
      (!fSource || (fSource === 'お客様から') === (r.source === 'customer')) &&
      (!fKind || (r.kind || 'お客様の声') === fKind));
    $('list').innerHTML = shown.length ? shown.map(r => {
      const k = r.kind || 'お客様の声';
      return `
      <div class="item">
        <div class="body">
          <span class="tag ${r.source === 'customer' ? 'blue' : 'gray'}">${r.source === 'customer' ? 'お客様から' : '店員から'}</span><span class="tag ${KIND_COLOR[k] ?? ''}">${esc(k)}</span><span class="tag gray">${esc(r.category || '未分類')}</span>${r.section ? `<span class="tag gray">${esc(r.section)}</span>` : ''}${r.outcome ? `<span class="tag ${r.outcome === 'お断りした' ? 'red' : 'gray'}">${esc(r.outcome)}</span>` : ''}
          <div class="summary">${esc(r.summary || '')}</div>
          ${r.item ? `<div class="raw"><b>商品：</b>${esc(r.item)}</div>` : ''}
          <div class="raw">${esc(r.content)}</div>
          <div class="meta">${new Date(r.created_at).toLocaleString('ja-JP')}${r.rating ? `　<span class="stars-s">${stars(r.rating)}</span>` : ''}</div>
        </div>
        ${r.photo_url ? `<img src="${esc(r.photo_url)}" alt="添付写真" loading="lazy">` : ''}
      </div>`; }).join('') : (rows.length ? '条件に合う声はありません' : 'まだ記録はありません');
  }

  async function load() {
    try {
      rows = await api('/api/voices', 'GET');
      $('passbox').style.display = 'none';
      draw();
    } catch (e) { $('list').textContent = e.message; }
  }

  $('list').addEventListener('click', (e) => {
    const img = e.target.closest('img'); if (!img) return;
    $('lightbox-img').src = img.src; $('lightbox').style.display = 'flex';
  });
  $('lightbox').addEventListener('click', () => { $('lightbox').style.display = 'none'; });

  function bars(obj, prev) {
    const entries = Object.entries(obj).sort((a, b) => b[1] - a[1]);
    const max = Math.max(1, ...entries.map(e => e[1]));
    return entries.map(([k, v]) => {
      const p = prev ? (prev[k] || 0) : null;
      const diff = p === null ? '' : `<em>（前月 ${p}件）</em>`;
      return `<div class="bar"><span>${esc(k)}</span><i style="width:${Math.round(v / max * 60)}%"></i><b>${v}件</b>${diff}</div>`;
    }).join('');
  }
  const list = (arr) => (arr && arr.length) ? `<ul>${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '<p class="meta">なし</p>';

  const STATUSES = ['やる', '見送り', '実施済み'];
  const stars = (n) => '★'.repeat(Number(n) || 0) + '☆'.repeat(5 - (Number(n) || 0));

  function actCard(a, i, isService) {
    const d = a.data || {};
    return `
      <div class="act" data-id="${a.id}">
        <div class="head"><span class="rank">${i + 1}</span><span class="name">${esc(a.title)}</span></div>
        <div class="scores">
          <span>効果 ${stars(d.impact)}</span><span>手軽さ ${stars(d.ease)}</span>
          <span>費用 ${esc(d.cost)}</span><span>開始 ${esc(d.start)}</span>
        </div>
        <div class="row"><b>理由：</b>${esc(d.reason)}</div>
        ${isService
          ? `<div class="row"><b>まず試す：</b>${esc(d.trial)}</div>`
          : `<div class="row"><b>担当：</b>${esc(d.owner)}　<b>期限：</b>${esc(d.due)}</div>`}
        <div class="row"><b>確かめ方：</b>${esc(d.measure)}</div>
        <div class="status">${STATUSES.map(s => `<button type="button" data-s="${s}" class="${a.status === s ? 'on' : ''}">${s}</button>`).join('')}</div>
      </div>`;
  }

  function renderActions(actions, kind) {
    const list = (actions || []).filter(a => a.kind === kind).sort((a, b) => (b.data?.score || 0) - (a.data?.score || 0));
    return list.length ? list.map((a, i) => actCard(a, i, kind === 'service')).join('') : '<p class="meta">なし</p>';
  }

  $('report').addEventListener('click', async (e) => {
    const b = e.target.closest('.status button'); if (!b) return;
    const card = b.closest('.act');
    const next = b.classList.contains('on') ? '未決定' : b.dataset.s;
    try {
      await api('/api/actions', 'PATCH', { id: Number(card.dataset.id), status: next });
      card.querySelectorAll('.status button').forEach(x => x.classList.toggle('on', x.dataset.s === next));
    } catch (err) { $('rmsg').textContent = err.message; }
  });

  function render(row) {
    if (!row) { $('report').innerHTML = 'この月のレポートはまだありません。上のボタンで作れます'; return; }
    const { stats: s, ai } = row.content;
    if (row.content.version === 2) { renderV2(row, s, ai); return; }
    $('report').innerHTML = `
      <div class="meta">作成：${new Date(row.created_at).toLocaleString('ja-JP')}</div>
      <h2>今月の要点</h2>${list(ai.highlights)}
      <h2>件数</h2>
      <div class="stat">
        <div>記録の件数<b>${s.total}件</b><span class="meta">前月 ${s.prevTotal}件</span></div>
        <div>お断りした件数<b>${s.byOutcome['お断りした'] || 0}件</b></div>
      </div>
      <h2>分類ごと</h2>${bars(s.byCategory, s.prevByCategory)}
      <h2>売場ごと</h2>${bars(s.bySection)}
      <h2>注目テーマ</h2>
      ${(ai.themes || []).map(t => `
        <div class="theme">
          <div class="summary">${esc(t.title)}（${esc(t.count)}件）</div>
          ${(t.examples || []).map(q => `<div class="q">「${esc(q)}」</div>`).join('')}
          <div><b>見立て：</b>${esc(t.cause)}</div>
          <div><b>打ち手：</b>${esc(t.action)}</div>
        </div>`).join('') || '<p class="meta">なし</p>'}
      <h2>お断りした要望（新商品・サービスの種）</h2>
      ${(ai.declined || []).length ? `<ul>${ai.declined.map(d => `<li><b>${esc(d.request)}</b>（${esc(d.count)}件）<br>→ ${esc(d.idea)}</li>`).join('')}</ul>` : '<p class="meta">なし</p>'}
      <h2>すぐできる改善</h2>${list(ai.quick_wins)}
      <h2>検討したい新商品・サービス</h2>${list(ai.new_ideas)}
      <h2>来月確かめること</h2>${list(ai.next_checks)}`;
  }

  function renderV2(row, s, ai) {
    $('report').innerHTML = `
      <div class="meta">作成：${new Date(row.created_at).toLocaleString('ja-JP')}</div>
      ${row.content.context ? `<div class="meta">踏まえたお店の事情：${esc(row.content.context)}</div>` : ''}
      <h2>今月の要点</h2>${list(ai.highlights)}
      <h2>今月やること（優先順）</h2>
      <p class="meta">効果・手軽さ・費用・始めやすさから優先順を決めています。決めたら「やる／見送り／実施済み」を押してください。翌月のレポートで振り返ります。</p>
      ${renderActions(row.actions, 'action')}
      ${(ai.later || []).length ? `<h2>余力があればやること</h2>${list(ai.later)}` : ''}
      <h2>新商品・新サービスの案（優先順）</h2>
      ${renderActions(row.actions, 'service')}
      ${(ai.review || []).length ? `<h2>先月の提案の振り返り</h2>${ai.review.map(r => `<div class="rv"><b>${esc(r.title)}</b>（${esc(r.status)}）<br>${esc(r.comment)}</div>`).join('')}` : ''}
      <h2>件数</h2>
      <div class="stat">
        <div>記録の件数<b>${s.total}件</b><span class="meta">前月 ${s.prevTotal}件</span></div>
        <div>お断りした件数<b>${s.byOutcome['お断りした'] || 0}件</b></div>
        ${s.bySource ? `<div>お客様から直接<b>${s.bySource['お客様から'] || 0}件</b></div>` : ''}
        ${s.rating ? `<div>お客様の満足度<b>${s.rating.avg} / 5</b><span class="meta">${s.rating.count}件の平均</span></div>` : ''}
      </div>
      ${s.byKind ? `<h2>声の種類ごと</h2>${bars(s.byKind)}` : ''}
      <h2>分類ごと</h2>${bars(s.byCategory, s.prevByCategory)}
      <h2>売場ごと</h2>${bars(s.bySection)}
      <h2>注目テーマ</h2>
      ${(ai.themes || []).map(t => `
        <div class="theme">
          <div class="summary">${esc(t.title)}（${esc(t.count)}件）</div>
          ${(t.examples || []).map(q => `<div class="q">「${esc(q)}」</div>`).join('')}
          <div><b>見立て：</b>${esc(t.cause)}</div>
        </div>`).join('') || '<p class="meta">なし</p>'}
      <h2>お断りした要望</h2>
      ${(ai.declined || []).length ? `<ul>${ai.declined.map(d => `<li>${esc(d.request)}（${esc(d.count)}件）</li>`).join('')}</ul>` : '<p class="meta">なし</p>'}
      <h2>来月確かめること</h2>${list(ai.next_checks)}`;
  }

  async function loadReport() {
    $('rmsg').textContent = '';
    try { render(await api(`/api/report?month=${$('month').value}`, 'GET')); }
    catch (e) { $('report').textContent = e.message; }
  }

  $('make').addEventListener('click', async () => {
    $('rmsg').textContent = '';
    if (!$('month').value) { $('rmsg').textContent = '月を選んでください'; return; }
    $('make').disabled = true; $('make').textContent = 'AIが分析中…（30秒ほど）';
    const context = $('context').value.trim();
    try { localStorage.setItem('context', context); } catch (e) {}
    try { render(await api('/api/report', 'POST', { month: $('month').value, context })); }
    catch (e) { $('rmsg').textContent = e.message; }
    $('make').disabled = false; $('make').textContent = 'この月のレポートを作る';
  });
  $('month').addEventListener('change', loadReport);

  function show(tab) {
    const rec = tab === 'record';
    $('page-record').style.display = rec ? 'block' : 'none';
    $('page-report').style.display = rec ? 'none' : 'block';
    $('tab-record').classList.toggle('on', rec);
    $('tab-report').classList.toggle('on', !rec);
    if (!rec) loadReport();
  }
  $('tab-record').addEventListener('click', () => show('record'));
  $('tab-report').addEventListener('click', () => show('report'));

  $('passbtn').addEventListener('click', () => {
    passcode = $('pass').value;
    try { localStorage.setItem('adminPasscode', passcode); } catch (e) {}
    load();
  });

  try { $('context').value = localStorage.getItem('context') || ''; } catch (e) {}
  const now = new Date();
  $('month').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  load();
</script>
</body>
</html>
