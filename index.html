<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お客様の声メモ</title>
<style>
  :root { --ink:#1f2328; --sub:#59636e; --line:#d0d7de; --bg:#f6f8fa; --accent:#1f6feb; --soft:#ddf4ff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; color:var(--ink); background:var(--bg); font-size:17px; line-height:1.6; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:8px 0 12px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  label.ttl { display:block; font-weight:bold; margin:12px 0 6px; }
  label.ttl:first-child { margin-top:0; }
  textarea, input { width:100%; font-size:17px; padding:12px; border:1px solid var(--line); border-radius:8px; font-family:inherit; background:#fff; }
  textarea { min-height:130px; resize:vertical; }
  button { width:100%; margin-top:12px; padding:14px; font-size:18px; font-weight:bold; color:#fff; background:var(--accent); border:none; border-radius:8px; }
  button:disabled { opacity:.6; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chips button { width:auto; margin:0; padding:8px 14px; font-size:15px; font-weight:normal; background:#fff; color:var(--ink); border:1px solid var(--line); border-radius:999px; }
  .chips button.on { background:var(--soft); color:#0550ae; border-color:#54aeff; font-weight:bold; }
  .msg { margin-top:8px; font-size:15px; color:#cf222e; min-height:1em; }
  .thanks { display:none; background:#dafbe1; color:#116329; border-radius:8px; padding:12px; margin-top:12px; font-weight:bold; }
  .count { text-align:center; color:var(--sub); }
  .count b { display:block; font-size:30px; color:var(--ink); }
  .note { font-size:13px; color:var(--sub); margin:6px 0 0; }
  #passbox { display:none; }
</style>
</head>
<body>
<main>
  <h1>お客様の声メモ</h1>

  <div class="card" id="passbox">
    <label class="ttl" for="pass">合言葉</label>
    <input id="pass" type="password" autocomplete="off">
    <button id="passbtn" type="button">開く</button>
  </div>

  <div class="card">
    <label class="ttl" for="content">お客様の声・困りごと</label>
    <textarea id="content" placeholder="例：お惣菜の量が多すぎて一人暮らしには買いにくい、と言われた"></textarea>
    <p class="note">お客様のお名前や電話番号は書かないでください</p>
    <label class="ttl">売場</label>
    <div class="chips" id="sections"></div>
    <label class="ttl">対応結果</label>
    <div class="chips" id="outcomes"></div>
    <button id="send" type="button">記録する</button>
    <div class="msg" id="msg"></div>
    <div class="thanks" id="thanks">記録しました。ありがとうございます</div>
  </div>

  <div class="card count">
    今月集まった声
    <b id="count">―</b>
    <span class="note">みなさんの声は、毎月まとめて改善に活かします</span>
  </div>
</main>
<script>
  const SECTIONS = ['惣菜','青果','鮮魚','精肉','日配','加工食品','日用品','レジ','駐車場','その他'];
  const OUTCOMES = ['対応できた','お断りした','その他'];
  const $ = (id) => document.getElementById(id);
  let passcode = '';
  try { passcode = localStorage.getItem('passcode') || ''; } catch (e) {}
  let section = '', outcome = '';

  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function chips(el, list, onPick) {
    el.innerHTML = list.map(v => `<button type="button" data-v="${esc(v)}">${esc(v)}</button>`).join('');
    el.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      const on = !b.classList.contains('on');
      el.querySelectorAll('button').forEach(x => x.classList.remove('on'));
      if (on) b.classList.add('on');
      onPick(on ? b.dataset.v : '');
    });
  }
  chips($('sections'), SECTIONS, v => section = v);
  chips($('outcomes'), OUTCOMES, v => outcome = v);

  async function api(path, method, body) {
    const res = await fetch(path, {
      method,
      headers: { 'Content-Type': 'application/json', 'x-passcode': passcode },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401) { $('passbox').style.display = 'block'; throw new Error('合言葉を入力してください'); }
    if (!res.ok) throw new Error(data.error || 'エラーが発生しました');
    return data;
  }

  async function loadCount() {
    try {
      const d = await api('/api/voices?count=month', 'GET');
      $('passbox').style.display = 'none';
      $('count').textContent = `${d.count}件`;
    } catch (e) { $('msg').textContent = e.message; }
  }

  function resetChips() {
    section = ''; outcome = '';
    document.querySelectorAll('.chips button').forEach(x => x.classList.remove('on'));
  }

  $('send').addEventListener('click', async () => {
    const content = $('content').value.trim();
    $('msg').textContent = ''; $('thanks').style.display = 'none';
    if (!content) { $('msg').textContent = '内容を入力してください'; return; }
    $('send').disabled = true; $('send').textContent = '記録しています…';
    try {
      await api('/api/voices', 'POST', { content, section, outcome });
      $('content').value = ''; resetChips();
      $('thanks').style.display = 'block';
      await loadCount();
    } catch (e) { $('msg').textContent = e.message; }
    $('send').disabled = false; $('send').textContent = '記録する';
  });
  $('content').addEventListener('input', () => { $('msg').textContent = ''; $('thanks').style.display = 'none'; });

  $('passbtn').addEventListener('click', () => {
    passcode = $('pass').value;
    try { localStorage.setItem('passcode', passcode); } catch (e) {}
    $('msg').textContent = '';
    loadCount();
  });

  loadCount();
</script>
</body>
</html>
